name: Publicar en Firebase

# Cada cambio en main o en la rama de desarrollo se publica en https://mibingo-865e2.web.app
on:
  push:
    branches: [main, claude/trusting-johnson-zkigpq]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publicar web y reglas de seguridad
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14.27.0 deploy --only hosting,firestore:rules --project mibingo-865e2 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
